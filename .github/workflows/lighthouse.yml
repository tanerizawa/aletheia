name: Lighthouse Audit

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 0' # weekly on Sunday UTC

jobs:
  lighthouse:
    name: Run Lighthouse (Desktop)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse (desktop)
        run: |
          mkdir -p reports
          npx -y lighthouse https://academos.or.id --preset=desktop --output=html --output-path=reports/lighthouse-desktop.html --chrome-flags='--no-sandbox'

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: reports/
