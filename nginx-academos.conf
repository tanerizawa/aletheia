# Nginx Configuration for academos.or.id
# Updated: 2026-01-05
# Fix MIME type issues for Next.js static assets

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

# Upstream for Next.js application
upstream nextjs_academos {
    server 127.0.0.1:3001;
    keepalive 64;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name academos.or.id www.academos.or.id;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name academos.or.id www.academos.or.id;
    
    # SSL Certificate paths
    ssl_certificate /etc/letsencrypt/live/academos.or.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academos.or.id/privkey.pem;
    
    # SSL Configuration - Modern settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    # Root directory (not used, but required)
    root /var/www/html;
    
    # Logs
    access_log /var/log/nginx/academos_access.log;
    error_log /var/log/nginx/academos_error.log;
    
    # Max upload size
    client_max_body_size 10M;
    
    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";
    
    # ==========================================
    # CRITICAL: MIME TYPE CONFIGURATION
    # ==========================================
    
    # Include default MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Additional MIME types for Next.js
    types {
        application/javascript js mjs;
        text/css css;
        font/woff2 woff2;
        font/woff woff;
        font/ttf ttf;
        font/otf otf;
        image/svg+xml svg svgz;
        application/json json;
        text/xml xml;
    }
    
    # ==========================================
    # NEXT.JS STATIC ASSETS
    # ==========================================
    
    # Next.js static files with proper MIME types
    location /_next/static/ {
        proxy_pass http://nextjs_academos;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Force correct MIME types
        add_header Content-Type $upstream_http_content_type;
        
        # Long-term caching for static assets
        add_header Cache-Control "public, max-age=31536000, immutable";
        
        # Disable some security headers for static assets
        add_header X-Content-Type-Options "nosniff" always;
    }
    
    # Next.js chunks (JavaScript files)
    location ~* /_next/static/chunks/.*\.js$ {
        proxy_pass http://nextjs_academos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Force JavaScript MIME type
        default_type application/javascript;
        add_header Content-Type "application/javascript; charset=utf-8" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    
    # Next.js CSS files
    location ~* /_next/static/.*\.css$ {
        proxy_pass http://nextjs_academos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Force CSS MIME type
        default_type text/css;
        add_header Content-Type "text/css; charset=utf-8" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    
    # Font files
    location ~* /_next/static/media/.*\.(woff2|woff|ttf|otf|eot)$ {
        proxy_pass http://nextjs_academos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Proper font MIME types
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff" always;
    }
    
    # Next.js image optimization
    location /_next/image {
        proxy_pass http://nextjs_academos;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Image caching
        add_header Cache-Control "public, max-age=86400";
    }
    
    # Next.js data files
    location /_next/data/ {
        proxy_pass http://nextjs_academos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    
    # Public folder static assets
    location /public/ {
        proxy_pass http://nextjs_academos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }
    
    # Favicon and robots
    location = /favicon.ico {
        proxy_pass http://nextjs_academos;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }
    
    location = /robots.txt {
        proxy_pass http://nextjs_academos;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }
    
    # Sitemap
    location = /sitemap.xml {
        proxy_pass http://nextjs_academos;
        add_header Content-Type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }
    
    # API routes with rate limiting
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        
        proxy_pass http://nextjs_academos;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # No caching for API routes
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
    
    # All other requests to Next.js
    location / {
        limit_req zone=general burst=20 nodelay;
        
        proxy_pass http://nextjs_academos;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # No caching for HTML pages
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    
    # Health check endpoint (optional)
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
